name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install httpx==0.28.1

      - name: Run the suite (offline)
        run: python -m unittest discover -s tests -v

  hermes-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Hermes Agent
        run: |
          python -m pip install "hermes-agent>=0.23,<0.24" || \
          python -m pip install git+https://github.com/NousResearch/hermes-agent.git

      - name: Validate the plugin manifest
        run: hermes plugins validate . --install-deps

      - name: Doctor (runtime registration)
        run: hermes plugins doctor . --ci
