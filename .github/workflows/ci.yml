name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install test dependencies
        run: python -m pip install "httpx==0.28.1" "fastapi>=0.110,<1"

      - name: Run the suite (offline)
        run: python -m unittest discover -s tests -v

  hermes-validate:
    # The manifest gate of the catalog: validate + doctor against a real Hermes
    # checkout. Hermes is not on PyPI and its setup.py refuses non-Nix wheel
    # builds, so the runner clones the upstream repo and installs its pinned
    # dependencies with uv, resolved by the committed uv.lock.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The Hermes checkout lives OUTSIDE the plugin directory: the validate
      # security scan walks the plugin tree, and a nested Hermes checkout would
      # put its own YAML corpus under the scan.
      - uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          path: _hermes
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          working-directory: _hermes

      - name: Install Hermes dependencies (resolved by the committed uv.lock)
        working-directory: _hermes
        run: uv sync --frozen --no-dev

      - name: Validate the plugin manifest
        env:
          HERMES_HOME: ${{ runner.temp }}/hermes-home
        run: |
          mkdir -p ../plugin-tree
          git ls-files | rsync --files-from=- . ../plugin-tree/
          cd ../plugin-tree
          "$GITHUB_WORKSPACE/_hermes/.venv/bin/python" "$GITHUB_WORKSPACE/_hermes/hermes_cli/main.py" plugins validate . --install-deps

      - name: Doctor (runtime registration)
        env:
          HERMES_HOME: ${{ runner.temp }}/hermes-home
        run: |
          cd ../plugin-tree
          "$GITHUB_WORKSPACE/_hermes/.venv/bin/python" "$GITHUB_WORKSPACE/_hermes/hermes_cli/main.py" plugins doctor . --ci
