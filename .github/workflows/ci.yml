name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install test dependencies
        run: python -m pip install "httpx==0.28.1" "fastapi>=0.110,<1"

      - name: Run the suite (offline)
        run: python -m unittest discover -s tests -v

  hermes-validate:
    # The manifest gate of the catalog: validate + doctor against a real Hermes
    # checkout. Hermes is not on PyPI and its setup.py refuses non-Nix wheel
    # builds, so the runner clones the upstream repo, installs its pinned deps
    # (they require Python 3.14) and runs the CLI straight from the checkout
    # with a throwaway HERMES_HOME.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Checkout Hermes Agent
        uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          path: hermes-agent
          ref: main

      - name: Extract Hermes pinned dependencies
        working-directory: hermes-agent
        run: |
          python - <<'PY'
          import tomllib

          data = tomllib.load(open("pyproject.toml", "rb"))
          pins = data["project"]["dependencies"]
          open("../hermes-requirements.txt", "w", encoding="utf-8").write(
              "\n".join(pins) + "\n"
          )
          print(f"{len(pins)} pins extracted")
          PY

      - name: Install Hermes dependencies
        run: python -m pip install -r hermes-requirements.txt

      - name: Validate the plugin manifest
        env:
          HERMES_HOME: ${{ runner.temp }}/hermes-home
        run: |
          PYTHONPATH=hermes-agent python hermes-agent/hermes_cli/main.py plugins validate . --install-deps

      - name: Doctor (runtime registration)
        env:
          HERMES_HOME: ${{ runner.temp }}/hermes-home
        run: |
          PYTHONPATH=hermes-agent python hermes-agent/hermes_cli/main.py plugins doctor . --ci
