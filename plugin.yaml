manifest_version: 2
name: azure-devops
version: 0.1.0
description: >-
  Azure DevOps for the Hermes agent: projects, repositories, builds, pull
  requests, work items, wikis and releases, driven by a personal access token.
requires_hermes: ">=0.23"
requires_env:
  - name: AZURE_DEVOPS_PAT_TOKEN
    description: >-
      Azure DevOps personal access token (PAT) used to authenticate every call
      to the Azure DevOps REST API. Grant it the scopes the operations need
      (Code, Build & Release, Work items, Wiki) and paste it when the plugin is
      installed.
    url: https://learn.microsoft.com/en-us/azure/devops/integrate/get-started/authentication/personal-access-token
    secret: true
python_dependencies:
  - "fastapi>=0.110,<1"
license: MIT
homepage: https://github.com/lucaspdude/hermes-azure-devops-plugin
tags:
  - azure-devops
  - devops
  - pull-requests
  - builds
  - work-items
provides_tools:
  - azure_devops_list_projects
  - azure_devops_get_project
  - azure_devops_list_repositories
  - azure_devops_get_repository
  - azure_devops_list_build_definitions
  - azure_devops_list_builds
  - azure_devops_get_build
  - azure_devops_get_build_changes
  - azure_devops_get_build_timeline
  - azure_devops_list_pull_requests
  - azure_devops_get_pull_request
  - azure_devops_list_pull_request_comments
  - azure_devops_list_pull_request_labels
  - azure_devops_create_pull_request
  - azure_devops_add_pull_request_comment
  - azure_devops_add_pull_request_label
  - azure_devops_remove_pull_request_label
  - azure_devops_approve_pull_request
  - azure_devops_reject_pull_request
  - azure_devops_reset_pull_request_vote
  - azure_devops_abandon_pull_request
  - azure_devops_complete_pull_request
  - azure_devops_update_work_item
  - azure_devops_create_wiki_page
  - azure_devops_update_wiki_page
  - azure_devops_queue_build
  - azure_devops_query_wiql
  - azure_devops_get_work_item
  - azure_devops_list_work_items
  - azure_devops_list_wikis
  - azure_devops_list_wiki_pages
  - azure_devops_get_wiki_page
  - azure_devops_list_branches
  - azure_devops_get_branch
  - azure_devops_list_commits
  - azure_devops_get_commit
  - azure_devops_list_tags
  - azure_devops_list_build_artifacts
  - azure_devops_get_my_identity
  - azure_devops_list_identities
  - azure_devops_list_policies
  - azure_devops_list_release_definitions
  - azure_devops_list_releases
  - azure_devops_get_release

config_schema:
  organization:
    type: str
    required: true
    description: >-
      Azure DevOps organization name (the first path segment of
      https://dev.azure.com/<organization>). Required: the plugin is generic
      and never guesses an organization.
  base_url:
    type: str
    default: https://dev.azure.com
    description: >-
      Base URL of the Azure DevOps REST API. Change it for a sovereign cloud
      or an on-premises Azure DevOps Server.
  api_version:
    type: str
    default: "7.1"
    description: >-
      Default REST API version. Endpoints that only answer on a preview
      version override it in the client.
  default_project:
    type: str
    default: ""
    description: >-
      Project used when a tool is called without one. Empty means the caller
      has to name the project.
  ignored_projects:
    type: list
    default: []
    description: >-
      Projects the panel and listings skip entirely. Accepts project names (matched
      case-insensitively) or project ids. Purely a display/scan filter: tools still
      work when explicitly asked about an ignored project.
  default_days:
    type: int
    default: 7
    description: >-
      Default lookback window in days for pull requests, builds and work items
      listings (the panel exposes presets of 7, 30 and 90 days).
  http_timeout_ms:
    type: int
    default: 30000
    description: >-
      Timeout of each Azure DevOps request, in milliseconds.
