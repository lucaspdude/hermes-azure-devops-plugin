[project]
name = "hermes-azure-devops-plugin"
version = "0.1.0"
requires-python = ">=3.11,<3.15"
dependencies = [
  "fastapi>=0.110,<1",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = [
  "__init__", "registry", "toolkit", "config", "auth", "client", "errors",
  "pagination", "contracts", "help",
  "tools_projects", "tools_builds", "tools_pull_requests", "tools_pull_request_writes",
  "tools_work_items", "tools_wiki", "tools_git", "tools_artifacts", "tools_identity",
  "tools_policies", "tools_releases", "tools_writes",
]

[dependency-groups]
dev = ["httpx>=0.27", "pytest>=8", "fastapi>=0.110,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
